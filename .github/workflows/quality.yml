name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Check formatting
        run: uv run black --check afl_scraper tests
      - name: Lint
        run: uv run ruff check afl_scraper tests
      - name: Type check core modules
        run: uv run pyright
      - name: Test
        run: uv run pytest --cov=afl_scraper --cov-report=term-missing
